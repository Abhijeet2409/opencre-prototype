name: Prototype Pipeline

on:
  workflow_dispatch

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - run: python Filtering_script.py.py
      - run: python Raw_diff_collector.py.py
      - run: python Diff_cleaner.py.py

      - name: Upload Raw Bucket
        uses: actions/upload-artifact@v4
        with:
          name: raw_bucket
          path: Raw_Bucket/

      - name: Upload Cleaned Data
        uses: actions/upload-artifact@v4
        with:
          name: cleaned_data
          path: Cleaned_diffs/
